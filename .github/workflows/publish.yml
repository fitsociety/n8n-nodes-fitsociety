name: Publish reviewed package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Use npm with staged publishing support
        run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: node scripts/release-guard.mjs
      - name: Stage release with provenance
        run: npm stage publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
